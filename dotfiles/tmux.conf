# Enable mouse support (click to switch windows, resize panes, scroll)
set -g mouse on

# Remove the first-keystroke delay
set -s escape-time 0

# Raise the scrollback history limit
set -g history-limit 50000

# Start window numbering at 1 (default is 0; 1 is easier to reach on the keyboard)
set -g base-index 1
setw -g pane-base-index 1
